<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:linear-gradient(to bottom,#3b0f63,#5d1e8c,#200a3a);
  font-family:'Segoe UI',sans-serif;
  color:white;
  text-align:center;
}
canvas{
  position:absolute;
  top:0;
  left:0;
}
#title{
  position:absolute;
  top:50px;
  width:100%;
  font-size:42px;
  font-weight:bold;
}
#instruction{
  position:absolute;
  top:110px;
  width:100%;
  font-size:18px;
  opacity:.85;
}
#message{
  position:absolute;
  bottom:80px;
  width:100%;
  font-size:18px;
  line-height:28px;
}
</style>
</head>

<body>

<div id="title">Happy Birthday ❤️</div>
<div id="instruction">Tap anywhere to start</div>
<div id="message"></div>

<canvas id="canvas"></canvas>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3" type="audio/mp3">
</audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let state = "start";
let candleLit = false;
let lastClick = 0;
let fireworks = [];
let balloons = [];
let stars = [];
let messageLines = [
"We just met 2 days ago, but I still felt something real.",
"You're beautiful just the way you are.",
"Keep shining."
];
let revealed = 0;

for(let i=0;i<150;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2
  });
}

function drawStars(){
  ctx.fillStyle="white";
  stars.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });
}

function drawCake(){
  let cx = canvas.width/2;
  let cy = canvas.height/2+80;

  // base
  ctx.fillStyle="#ffd6e8";
  ctx.fillRect(cx-150,cy,300,150);

  // frosting
  ctx.fillStyle="#ff69b4";
  ctx.fillRect(cx-160,cy-50,320,70);

  // candle
  ctx.fillStyle="#fff0f5";
  ctx.fillRect(cx-12,cy-120,24,80);

  if(candleLit){
    ctx.fillStyle="orange";
    ctx.beginPath();
    ctx.arc(cx,cy-135,12,0,Math.PI*2);
    ctx.fill();
  }

  return {x:cx-20,y:cy-150,w:40,h:100};
}

function spawnFirework(){
  let x=Math.random()*canvas.width;
  let y=Math.random()*canvas.height/2;
  for(let i=0;i<50;i++){
    fireworks.push({
      x:x,
      y:y,
      vx:(Math.random()-0.5)*7,
      vy:(Math.random()-0.5)*7,
      life:70
    });
  }
}

function updateFireworks(){
  fireworks.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
  });
  fireworks = fireworks.filter(p=>p.life>0);

  fireworks.forEach(p=>{
    ctx.fillStyle="rgba(255,200,120,"+(p.life/70)+")";
    ctx.fillRect(p.x,p.y,3,3);
  });
}

function spawnBalloon(){
  balloons.push({
    x:Math.random()*canvas.width,
    y:canvas.height+40,
    vy:1+Math.random()*1.5,
    size:15+Math.random()*10
  });
}

function updateBalloons(){
  balloons.forEach(b=>{
    b.y-=b.vy;
  });
  balloons = balloons.filter(b=>b.y>-100);

  balloons.forEach(b=>{
    ctx.fillStyle="pink";
    ctx.beginPath();
    ctx.ellipse(b.x,b.y,b.size,b.size*1.4,0,0,Math.PI*2);
    ctx.fill();
  });
}

canvas.addEventListener("click",(e)=>{
  let rect = drawCake();
  let now = Date.now();

  if(state==="start"){
    state="light";
    document.getElementById("instruction").innerText="Tap the candle to LIGHT it";
  }

  else if(state==="light"){
    if(e.clientX>rect.x && e.clientX<rect.x+rect.w &&
       e.clientY>rect.y && e.clientY<rect.y+rect.h){
        candleLit=true;
        document.getElementById("music").play();
        state="blow";
        document.getElementById("instruction").innerText="Make a wish... then double tap to blow it out";
    }
  }

  else if(state==="blow"){
    if(now-lastClick<300){
      candleLit=false;
      state="message";
      document.getElementById("instruction").innerText="Wish comes true ✨";
      spawnFirework();
      revealMessage();
    }
  }

  lastClick=now;
});

function revealMessage(){
  let box = document.getElementById("message");
  box.innerHTML="";
  let i=0;
  let interval=setInterval(()=>{
    if(i>=messageLines.length){
      clearInterval(interval);
      return;
    }
    box.innerHTML+=messageLines[i]+"<br>";
    i++;
  },700);
}

function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawStars();
  drawCake();

  if(state==="message"){
    if(Math.random()<0.07) spawnFirework();
    if(Math.random()<0.04) spawnBalloon();
    updateFireworks();
    updateBalloons();
  }

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
